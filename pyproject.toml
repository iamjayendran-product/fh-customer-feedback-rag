[project]
name = "fh-feedback"
version = "0.1.0"
description = "Foodhub UK customer feedback collection, tagging, analysis and RAG (v1, research/discovery)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "duckdb>=1.0",
    "pandas>=2.2",
    "google-play-scraper>=1.2",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
