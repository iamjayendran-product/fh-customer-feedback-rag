# FH ReviewIQ — Fly.io app config. Deploy with: fly launch (first time)
# or fly deploy (subsequent updates), from the project root.
#
# Set secrets before the first deploy:
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
#   fly secrets set FEEDBACK_RADAR_TOKEN=<a password you choose>
app = "fh-reviewiq"   # change if that name's taken - fly will tell you
primary_region = "lhr"    # London - closest to a UK-focused dataset; change freely

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # sentence-transformers + torch need headroom beyond the default 256mb
